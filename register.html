<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Lab Record Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <h2>Create Account</h2>
        <h3 style="display: block; text-align: center; border-bottom: none; margin-bottom: 20px; font-weight: 500;">Enter your details</h3>

        <form onsubmit="registerUser(); return false;">
            <div class="form-group">
                <label for="Name">Full Name</label>
                <input type="text" id="Name" name="Name" placeholder="Enter Name" required>
            </div>

            <div class="form-group">
                <label for="MailId">Email Address</label>
                <input type="email" id="MailId" name="MailId" placeholder="Enter Email Address" required>
            </div>

            <div class="form-group">
                <label for="Password">Password</label>
                <input type="password" id="Password" name="Password" placeholder="Enter Password" required>
            </div>

            <button type="submit">Submit Details</button>
        </form>

        <p class="footer-text">Already have an account? <a href="login.html">Sign In</a></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
