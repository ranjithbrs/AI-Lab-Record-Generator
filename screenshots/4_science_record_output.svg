<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="btnPdf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="btnSuccess" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="960" height="760" fill="url(#bg)"/>

  <!-- Main Card -->
  <rect x="70" y="30" width="820" height="700" rx="20" fill="url(#cardBg)" stroke="rgba(255,255,255,0.1)"/>

  <!-- Title -->
  <text x="480" y="70" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">
    🔬 Physics Laboratory Record
  </text>

  <!-- Student Meta Banner -->
  <rect x="100" y="85" width="760" height="42" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="120" y="111" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    👤 <tspan font-weight="700">Student:</tspan> <tspan fill="#a5b4fc">Ranjith B</tspan>
  </text>
  <text x="350" y="111" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    📚 <tspan font-weight="700">Subject:</tspan> <tspan fill="#a5b4fc">Physics Lab</tspan>
  </text>
  <text x="640" y="111" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    🔬 <tspan font-weight="700">Topic:</tspan> <tspan fill="#a5b4fc">Vernier Calipers</tspan>
  </text>

  <!-- Section 1: Aim -->
  <text x="100" y="152" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">🎯 Aim</text>
  <text x="100" y="172" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">To determine the dimensions and volume of a cylinder and a sphere using Vernier Calipers.</text>

  <!-- Section 2: Theory -->
  <text x="100" y="210" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">📖 Theory &amp; Principle</text>
  <text x="100" y="230" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Least Count (LC) = 1 Main Scale Division (MSD) - 1 Vernier Scale Division (VSD) = 0.1 mm = 0.01 cm.</text>
  <text x="100" y="248" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Total Reading (TR) = MSR + (VSR × LC) ± Zero Correction.</text>
  <text x="100" y="266" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Volume of Cylinder = π × (D/2)² × h  |  Volume of Sphere = (4/3) × π × (D/2)³</text>

  <!-- Section 3: Procedure -->
  <text x="100" y="302" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">🔬 Procedure</text>
  <text x="100" y="322" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">1. Determine the least count and zero error of the instrument.</text>
  <text x="100" y="340" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">2. Grip the cylinder longitudinally between lower jaws to record Main Scale Reading (MSR) and Vernier Coincidence (VSR).</text>
  <text x="100" y="358" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">3. Repeat measurements across different diameters to compute the mean diameter (D).</text>
  <text x="100" y="376" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">4. Place sphere between jaws and calculate total volume using standard equations.</text>

  <!-- Section 4: Observation Table -->
  <text x="100" y="412" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">📝 Observation &amp; Readings</text>
  <rect x="100" y="424" width="760" height="120" rx="8" fill="url(#boxBg)" stroke="rgba(255,255,255,0.08)"/>
  <text x="120" y="448" fill="#38bdf8" font-family="'Consolas', monospace" font-size="12">Instrument Least Count (LC) = 0.01 cm  |  Zero Error = Nil</text>
  <text x="120" y="470" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="12">Mean Diameter of Sphere (D)  = 2.42 cm</text>
  <text x="120" y="490" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="12">Mean Height of Cylinder (h)  = 4.86 cm</text>
  <text x="120" y="510" fill="#34d399" font-family="'Consolas', monospace" font-size="12">Calculated Volume of Cylinder = 22.38 cm³</text>
  <text x="120" y="530" fill="#34d399" font-family="'Consolas', monospace" font-size="12">Calculated Volume of Sphere   = 7.42 cm³</text>

  <!-- Section 5: Result -->
  <text x="100" y="575" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">✅ Result</text>
  <text x="100" y="595" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">The dimensions and volume of the given cylinder (22.38 cm³) and sphere (7.42 cm³) were determined accurately using Vernier Calipers.</text>

  <!-- Action Buttons -->
  <rect x="100" y="640" width="190" height="42" rx="10" fill="url(#btnPdf)"/>
  <text x="195" y="666" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📄 Download PDF / Print</text>

  <rect x="305" y="640" width="150" height="42" rx="10" fill="url(#btnSuccess)"/>
  <text x="380" y="666" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⬇️ Download .txt</text>

  <rect x="470" y="640" width="110" height="42" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
  <text x="525" y="666" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">📋 Copy</text>

  <rect x="595" y="640" width="180" height="42" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
  <text x="685" y="666" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">🔄 Generate Another</text>
</svg>
