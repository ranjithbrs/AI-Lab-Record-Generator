<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <linearGradient id="codeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="btnPdf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="btnSuccess" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="960" height="760" fill="url(#bg)"/>

  <!-- Main Card -->
  <rect x="70" y="30" width="820" height="700" rx="20" fill="url(#cardBg)" stroke="rgba(255,255,255,0.1)"/>

  <!-- Title -->
  <text x="480" y="70" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">
    🧪 Laboratory Record
  </text>

  <!-- Student Meta Banner -->
  <rect x="100" y="85" width="760" height="42" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="120" y="111" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    👤 <tspan font-weight="700">Student:</tspan> <tspan fill="#a5b4fc">Ranjith B</tspan>
  </text>
  <text x="350" y="111" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    📚 <tspan font-weight="700">Subject:</tspan> <tspan fill="#a5b4fc">Computer Science</tspan>
  </text>
  <text x="640" y="111" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    📅 <tspan font-weight="700">Date:</tspan> <tspan fill="#a5b4fc">01 Nov 2026</tspan>
  </text>

  <!-- Section 1: Aim -->
  <text x="100" y="152" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">🎯 Aim</text>
  <text x="100" y="172" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">To implement a Binary Search algorithm in Python to search for an element in a sorted list.</text>

  <!-- Section 2: Algorithm -->
  <text x="100" y="210" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">⚙️ Algorithm</text>
  <text x="100" y="230" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">1. Read the list of elements and target key value to search.</text>
  <text x="100" y="248" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">2. Set low pointer = 0 and high pointer = len(array) - 1.</text>
  <text x="100" y="266" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">3. Loop while low &lt;= high: calculate mid = (low + high) // 2.</text>
  <text x="100" y="284" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">4. If array[mid] == target, return mid index. If array[mid] &lt; target, low = mid + 1; else high = mid - 1.</text>
  <text x="100" y="302" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">5. If target is not found after loop terminates, return -1.</text>

  <!-- Section 3: Program / Code -->
  <text x="100" y="336" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">💻 Program / Code</text>
  <rect x="100" y="348" width="760" height="175" rx="10" fill="url(#codeBg)" stroke="rgba(255,255,255,0.08)"/>
  <text x="115" y="370" fill="#34d399" font-family="'Consolas', monospace" font-size="12">def binary_search(arr, target):</text>
  <text x="135" y="388" fill="#93c5fd" font-family="'Consolas', monospace" font-size="12">    low, high = 0, len(arr) - 1</text>
  <text x="135" y="406" fill="#f472b6" font-family="'Consolas', monospace" font-size="12">    while low &lt;= high:</text>
  <text x="155" y="424" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="12">        mid = (low + high) // 2</text>
  <text x="155" y="442" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="12">        if arr[mid] == target: return mid</text>
  <text x="155" y="460" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="12">        elif arr[mid] &lt; target: low = mid + 1</text>
  <text x="155" y="478" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="12">        else: high = mid - 1</text>
  <text x="135" y="496" fill="#f87171" font-family="'Consolas', monospace" font-size="12">    return -1</text>
  <text x="115" y="514" fill="#a5b4fc" font-family="'Consolas', monospace" font-size="12">arr = [2, 3, 4, 10, 40]; print('Element at index:', binary_search(arr, 10))</text>

  <!-- Section 4: Expected Output -->
  <text x="100" y="545" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">📊 Expected Output</text>
  <rect x="100" y="555" width="760" height="34" rx="8" fill="url(#codeBg)" stroke="rgba(255,255,255,0.08)"/>
  <text x="115" y="577" fill="#38bdf8" font-family="'Consolas', monospace" font-size="12">Element at index: 3</text>

  <!-- Section 5: Result -->
  <text x="100" y="612" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">✅ Result</text>
  <text x="100" y="632" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">The Binary Search program was successfully written, compiled, and executed with logarithmic time complexity O(log n).</text>

  <!-- Action Buttons -->
  <rect x="100" y="660" width="190" height="42" rx="10" fill="url(#btnPdf)"/>
  <text x="195" y="686" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📄 Download PDF / Print</text>

  <rect x="305" y="660" width="150" height="42" rx="10" fill="url(#btnSuccess)"/>
  <text x="380" y="686" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⬇️ Download .txt</text>

  <rect x="470" y="660" width="110" height="42" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
  <text x="525" y="686" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">📋 Copy</text>

  <rect x="595" y="660" width="180" height="42" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
  <text x="685" y="686" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">🔄 Generate Another</text>
</svg>
