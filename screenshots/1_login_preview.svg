<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bg)"/>
  
  <!-- Subtle Glow Circles -->
  <circle cx="250" cy="180" r="140" fill="#6366f1" opacity="0.12"/>
  <circle cx="680" cy="420" r="160" fill="#8b5cf6" opacity="0.12"/>

  <!-- Card Container -->
  <g filter="url(#shadow)">
    <rect x="230" y="80" width="440" height="440" rx="24" fill="url(#cardBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  </g>

  <!-- Title -->
  <text x="450" y="145" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">
    🧪 AI Lab Record
  </text>
  <text x="450" y="175" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    Sign in to generate ready-to-submit lab reports
  </text>

  <!-- Form Fields -->
  <!-- Username Label -->
  <text x="270" y="225" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Student Username</text>
  <rect x="270" y="235" width="360" height="46" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5"/>
  <text x="288" y="264" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Ranjith B</text>

  <!-- Password Label -->
  <text x="270" y="315" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Password</text>
  <rect x="270" y="325" width="360" height="46" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.2"/>
  <text x="288" y="356" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18">••••••••••••</text>

  <!-- Submit Button -->
  <rect x="270" y="405" width="360" height="48" rx="12" fill="url(#btnGrad)"/>
  <text x="450" y="435" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Sign In to Dashboard</text>

  <!-- Footer link -->
  <text x="450" y="485" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    Don't have an account? <tspan fill="#a5b4fc" font-weight="600">Register</tspan>
  </text>
</svg>
