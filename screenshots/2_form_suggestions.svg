<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="900" height="640" fill="url(#bg)"/>

  <!-- Card Container -->
  <g filter="url(#shadow)">
    <rect x="180" y="50" width="540" height="540" rx="24" fill="url(#cardBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  </g>

  <!-- Welcome Header -->
  <text x="450" y="105" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">
    Welcome, <tspan fill="#a5b4fc">Ranjith</tspan> 👋
  </text>
  <text x="450" y="132" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
    Select your subject and pick or type an experiment
  </text>

  <!-- Subject Dropdown -->
  <text x="220" y="175" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Select Subject</text>
  <rect x="220" y="185" width="460" height="46" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(99, 102, 241, 0.5)" stroke-width="1.5"/>
  <text x="238" y="214" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Computer Science / Programming</text>
  <polygon points="650,206 660,206 655,213" fill="#a5b4fc"/>

  <!-- Experiment Input -->
  <text x="220" y="265" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Experiment Title</text>
  <rect x="220" y="275" width="460" height="46" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(99, 102, 241, 0.5)" stroke-width="1.5"/>
  <text x="238" y="304" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Binary Search</text>

  <!-- Suggestion Chips Label -->
  <text x="220" y="350" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">💡 Quick Suggestions (Click to fill):</text>

  <!-- Chips Row 1 -->
  <!-- Active Chip -->
  <rect x="220" y="365" width="110" height="30" rx="15" fill="url(#btnGrad)"/>
  <text x="275" y="385" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">✓ Binary Search</text>

  <rect x="340" y="365" width="125" height="30" rx="15" fill="rgba(30, 41, 59, 0.9)" stroke="rgba(99,102,241,0.3)"/>
  <text x="402" y="385" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Stack Operations</text>

  <rect x="475" y="365" width="95" height="30" rx="15" fill="rgba(30, 41, 59, 0.9)" stroke="rgba(99,102,241,0.3)"/>
  <text x="522" y="385" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Bubble Sort</text>

  <rect x="580" y="365" width="100" height="30" rx="15" fill="rgba(30, 41, 59, 0.9)" stroke="rgba(99,102,241,0.3)"/>
  <text x="630" y="385" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Merge Sort</text>

  <!-- Chips Row 2 -->
  <rect x="220" y="405" width="95" height="30" rx="15" fill="rgba(30, 41, 59, 0.9)" stroke="rgba(99,102,241,0.3)"/>
  <text x="267" y="425" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Quick Sort</text>

  <rect x="325" y="405" width="120" height="30" rx="15" fill="rgba(30, 41, 59, 0.9)" stroke="rgba(99,102,241,0.3)"/>
  <text x="385" y="425" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Singly Linked List</text>

  <rect x="455" y="405" width="120" height="30" rx="15" fill="rgba(30, 41, 59, 0.9)" stroke="rgba(99,102,241,0.3)"/>
  <text x="515" y="425" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">SQL DDL &amp; DML</text>

  <!-- Submit Button -->
  <rect x="220" y="465" width="460" height="48" rx="12" fill="url(#btnGrad)"/>
  <text x="450" y="495" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">🚀 Generate Lab Record</text>

  <!-- Logout Button -->
  <rect x="400" y="530" width="100" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
  <text x="450" y="551" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Logout</text>
</svg>
