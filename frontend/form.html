<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Experiment Form</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
   <h2>Welcome, [Username]</h2>
   <h3>Enter Experiment Details</h3>

   <form onsubmit="submitForm(); return false;">
      <label for="Subject">Subject:</label>
      <input type="text" id="Subject" name="Subject" placeholder="Enter Subject" required><br><br>

      <label for="Experiment">Experiment Title:</label>
      <input type="text" id="Experiment" name="Experiment" placeholder="Enter Experiment Title" required><br><br>

      <button type="submit">Generate</button>
   </form>

   <script src="script.js"></script>
</body>
</html>
